description: 'Madison Reed is a female-founded and female-led direct-to-consumer hair
  color company offering 8-Free permanent, demi-permanent, and root touch-up hair
  color crafted in Italy, sold as at-home kits and delivered as professional services
  at 95+ Hair Color Bar locations across the United States. The company blends
  e-commerce retail, subscription replenishment, and in-person salon booking. It was
  surfaced as a portfolio company of Norwest Venture Partners and True Ventures. As
  of this enrichment pass the company publishes no public developer program, API
  documentation, or machine-readable API surface; this profile captures identity and
  probed domain-security posture only.'
